<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-label="npm run demo output for verify_email MCP tool">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <style>
      .title { font: 600 13px Segoe UI, system-ui, sans-serif; fill: #cdd6f4; }
      .text  { font: 14px Consolas, Monaco, monospace; fill: #cdd6f4; }
      .dim   { fill: #6c7086; }
      .green { fill: #a6e3a1; }
      .yellow{ fill: #f9e2af; }
      .blue  { fill: #89b4fa; }
      .red   { fill: #f38ba8; }
    </style>
  </defs>

  <rect width="920" height="720" rx="12" fill="url(#bg)"/>
  <rect x="0" y="0" width="920" height="40" rx="12" fill="#181825"/>
  <rect x="0" y="28" width="920" height="12" fill="#181825"/>
  <circle cx="20" cy="20" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="20" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="20" r="6" fill="#a6e3a1"/>
  <text x="80" y="25" class="title">PowerShell  tvaram</text>

  <text x="24" y="72" class="text dim">C:\Users\Aayush Sharma\OneDrive\Desktop\tvaram&gt;</text>
  <text x="430" y="72" class="text green">npm run demo</text>

  <text x="24" y="104" class="text dim">&gt; inboxvalid-mcp-server@0.1.0 demo</text>
  <text x="24" y="128" class="text dim">&gt; tsx scripts/demo.ts</text>

  <text x="24" y="164" class="text yellow">InboxValid MCP demo  verify_email tool</text>

  <text x="24" y="200" class="text blue">--- valid email ---</text>
  <text x="24" y="224" class="text">Input: user@example.com</text>
  <text x="24" y="248" class="text">{</text>
  <text x="40" y="272" class="text">"email": "user@example.com",</text>
  <text x="40" y="296" class="text">"status": <tspan class="green">"valid"</tspan>,</text>
  <text x="40" y="320" class="text">"reason": "Mailbox exists and is deliverable"</text>
  <text x="24" y="344" class="text">}</text>

  <text x="24" y="380" class="text blue">--- invalid syntax ---</text>
  <text x="24" y="404" class="text">Input: not-an-email</text>
  <text x="24" y="428" class="text">{</text>
  <text x="40" y="452" class="text">"email": "not-an-email",</text>
  <text x="40" y="476" class="text">"status": <tspan class="red">"invalid"</tspan>,</text>
  <text x="40" y="500" class="text">"reason": "Invalid email address format"</text>
  <text x="24" y="524" class="text">}</text>

  <text x="24" y="560" class="text blue">--- disposable domain ---</text>
  <text x="24" y="584" class="text">Input: user@mailinator.com</text>
  <text x="24" y="608" class="text">{</text>
  <text x="40" y="632" class="text">"email": "user@mailinator.com",</text>
  <text x="40" y="656" class="text">"status": <tspan class="yellow">"risky"</tspan>,</text>
